name: Deploy Next.js (Self-hosted)

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Pull latest code
        run: |
          cd /app/ai-marketing
          git fetch origin
          git reset --hard origin/master

      - name: Install deps
        run: |
          cd /app/ai-marketing
          npm install

      - name: Build
        run: |
          sudo chown -R $(whoami):$(whoami) /app/ai-marketing
          cd /app/ai-marketing
          rm -rf .next
          npm run build

      - name: Restart app
        run: |
          cd /app/ai-marketing
          pm2 restart ai-app --update-env
